<input type="checkbox" id="theme-toggle" aria-label="Switch between light and dark theme">
<label for="theme-toggle" class="theme-toggle" title="Switch theme" aria-hidden="true">
    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</label>
<script>
    /* Switching works with CSS alone; this only remembers the choice across pages. */
    (() => {
        const toggle = document.getElementById('theme-toggle');
        const systemDark = matchMedia('(prefers-color-scheme: dark)');
        const read = () => { try { return localStorage.getItem('theme'); } catch { return null; } };
        const apply = () => {
            const theme = read();
            if (theme) toggle.checked = (theme === 'dark') !== systemDark.matches;
        };
        apply();
        systemDark.addEventListener('change', apply);
        toggle.addEventListener('change', () => {
            try { localStorage.setItem('theme', toggle.checked !== systemDark.matches ? 'dark' : 'light'); } catch {}
        });
    })();
</script>
